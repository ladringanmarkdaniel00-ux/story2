<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple & iOS WebKit Standalone Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Darlingan App" />
    <meta name="application-name" content="Darlingan App" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.svg" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="mask-icon" href="/icons/icon-maskable.svg" color="#000000" />

    <!-- Google Fonts Preconnect & Preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- SEO & Social Discoverability -->
    <title>Darlingan App</title>
    <meta name="description" content="Darlingan" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dan.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Darlingan App" />
    <meta property="og:description" content="Darlingan" />
    <meta property="og:site_name" content="DAN Darlingan" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Darlingan App" />
    <meta name="twitter:description" content="Darlingan" />

    <!-- JSON-LD Structured Data Schema -->
    <script type="application/ld+json" id="seo-structured-data">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "DAN Darlingan",
      "url": "https://dan.app/",
      "description": "Darlingan",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://dan.app/shop?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
